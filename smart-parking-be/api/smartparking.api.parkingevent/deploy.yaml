apiVersion: apps/v1

kind: Deployment

metadata:
  name: apiparkingevent
  namespace: smart-parking
  labels:
    app: apiparkingevent

spec:
  replicas: 1

  selector:
    matchLabels:
      app: apiparkingevent

  template:
    metadata:
      labels:
        app: apiparkingevent

    spec:
      containers:
        - name: apiparkingevent

          image: docker.io/er4ikk/apiparkingevent
          resources:
              requests:
                memory: "64Mi"
                cpu: "250m"
              limits:
                memory: "128Mi"
                cpu: "500m"

          ports:
            - containerPort: 8080
